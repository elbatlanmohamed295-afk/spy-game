<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>أين البرص؟ - Game Night</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --bg: #2d3436;
            --card-bg: #dfe6e9;
            --dark-card: #1e272e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- UI Elements --- */
        .card {
            background: var(--dark-card);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid #444;
        }

        input {
            width: 80%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: #444;
            color: white;
            margin: 10px 0;
            font-size: 16px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        
        button:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: #00b894; color: white; }
        .btn-danger { background: #ff7675; color: white; }

        .hidden { display: none !important; }

        /* --- Player List --- */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .player-item {
            background: #636e72;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        /* --- The Flip Card (Role Reveal) --- */
        .scene {
            width: 100%;
            height: 250px;
            perspective: 600px;
            margin: 20px 0;
            cursor: pointer;
        }
        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1s;
            transform-style: preserve-3d;
        }
        .card-object.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .card-face-front { background: var(--secondary); color: #2d3436; }
        .card-face-back { background: var(--primary); color: white; transform: rotateY(180deg); }

        /* --- Voting System --- */
        .vote-btn {
            background: #ff7675;
            margin-top: 5px;
            font-size: 12px;
            padding: 5px;
        }
        .selected { border: 3px solid yellow; }

        /* --- Timer --- */
        #timerBar {
            width: 100%;
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
        #timerFill {
            height: 100%;
            background: var(--secondary);
            width: 100%;
            transition: width 1s linear;
        }

    </style>
</head>
<body>

<div class="container">
    <img src="{{ url_for('static', filename='logo.png') }}" style="width: 80px; margin-bottom: 10px;">
    
    <div id="screen-login" class="card">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسمك إيه؟">
        <button class="btn-primary" onclick="createRoom()">إنشاء غرفة جديدة</button>
        <div style="margin:15px; color:#aaa">- أو -</div>
        <input type="text" id="roomCodeInput" placeholder="كود الغرفة">
        <button class="btn-success" onclick="joinRoom()">دخول غرفة</button>
    </div>

    <div id="screen-lobby" class="card hidden">
        <h3>غرفة: <span id="lobbyCode" style="color:var(--secondary)"></span></h3>
        <p>في انتظار اللاعبين...</p>
        <div id="playerList" class="player-grid"></div>
        <br>
        <button id="startBtn" class="btn-success hidden" onclick="startGame()">ابدأ اللعبة 🎮</button>
    </div>

    <div id="screen-game" class="hidden">
        
        <div class="scene" onclick="this.querySelector('.card-object').classList.toggle('is-flipped')">
            <div class="card-object">
                <div class="card-face card-face-front">
                    اضغط لتعرف دورك 🕵️‍♂️
                    <small style="font-size:12px; margin-top:10px">(سرية تامة)</small>
                </div>
                <div class="card-face card-face-back">
                    <div id="roleContent">Loading...</div>
                </div>
            </div>
        </div>

        <div id="timerBar"><div id="timerFill"></div></div>
        <h2 id="timerText">05:00</h2>

        <div class="card">
            <h3>🗳️ مين هو البرص؟</h3>
            <p style="font-size:12px; color:#aaa">اضغط على اسم الشخص للتصويت ضده</p>
            <div id="votingGrid" class="player-grid"></div>
            <button class="btn-danger" id="submitVoteBtn" onclick="submitVote()" disabled>تأكيد التصويت</button>
        </div>
    </div>

    <div id="screen-result" class="card hidden">
        <h1 id="winnerTitle"></h1>
        <p id="resultMsg" style="font-size:18px; margin: 20px 0;"></p>
        
        <div style="background:#333; padding:10px; border-radius:10px;">
            <h4>نتيجة التصويت:</h4>
            <ul id="votesSummary" style="list-style:none; padding:0; text-align:right;"></ul>
        </div>

        <button class="btn-danger" onclick="requestPunishment()">عجلة العقاب 😈</button>
        <div id="punishmentDisplay" class="hidden">
            <h3 id="pText" style="color:#ff7675"></h3>
            <img id="pImg" src="" style="width:100%; border-radius:10px;">
        </div>
        
        <button class="btn-primary" onclick="resetGame()">لعبة جديدة 🔄</button>
    </div>

</div>

<script>
    const socket = io();
    let myName = "";
    let myRoom = "";
    let selectedSuspect = null;

    // --- Navigation ---
    function showScreen(id) {
        document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    // --- Socket Events ---
    socket.on('error', data => alert(data.msg));

    function createRoom() {
        myName = document.getElementById('username').value.trim();
        if(!myName) return alert("اكتب اسمك!");
        socket.emit('create_room', {name: myName});
    }

    socket.on('room_created', data => {
        myRoom = data.code;
        enterLobby(data.code, true);
    });

    function joinRoom() {
        myName = document.getElementById('username').value.trim();
        let code = document.getElementById('roomCodeInput').value.trim();
        if(!myName || !code) return alert("بيانات ناقصة");
        socket.emit('join_room', {name: myName, code: code});
    }

    socket.on('join_success', data => {
        myRoom = data.code;
        enterLobby(data.code, data.is_host);
    });

    function enterLobby(code, isHost) {
        showScreen('screen-lobby');
        document.getElementById('lobbyCode').innerText = code;
        if(isHost) document.getElementById('startBtn').classList.remove('hidden');
    }

    socket.on('update_players', data => {
        const div = document.getElementById('playerList');
        div.innerHTML = data.players.map(p => `<div class="player-item">👤 ${p}</div>`).join('');
    });

    // --- Game Logic ---
    function startGame() {
        socket.emit('start_game', {code: myRoom});
    }

    socket.on('game_started', data => {
        showScreen('screen-game');
        // إعداد الكارت
        const content = document.getElementById('roleContent');
        if(data.role === 'gecko') {
            content.innerHTML = `<h1 style="color:#ff7675">أنت البرص 🦎</h1><p>اسمعهم وحاول تعرف المكان</p>`;
        } else {
            content.innerHTML = `<h1 style="color:#55efc4">أنت مواطن 👮</h1><h3>${data.info}</h3><p>الفئة: ${data.category}</p>`;
        }
    });

    socket.on('update_players', data => {
        // تحديث قائمة التصويت أثناء اللعب
        const grid = document.getElementById('votingGrid');
        grid.innerHTML = "";
        data.players.forEach(p => {
            if(p === myName) return; // لا تصوت لنفسك
            let btn = document.createElement('div');
            btn.className = 'player-item';
            btn.style.cursor = 'pointer';
            btn.innerText = p;
            btn.onclick = () => selectSuspect(p, btn);
            grid.appendChild(btn);
        });
    });

    // --- Voting ---
    function selectSuspect(name, element) {
        selectedSuspect = name;
        document.querySelectorAll('#votingGrid .player-item').forEach(el => el.style.border = 'none');
        element.style.border = '2px solid #ff7675';
        document.getElementById('submitVoteBtn').disabled = false;
    }

    function submitVote() {
        document.getElementById('submitVoteBtn').innerText = "تم التصويت ✅";
        document.getElementById('submitVoteBtn').disabled = true;
        document.getElementById('votingGrid').classList.add('hidden'); // اخفاء القائمة
        socket.emit('submit_vote', {code: myRoom, voter: myName, suspect: selectedSuspect});
    }

    socket.on('vote_update', data => {
        // ممكن نظهر هنا مين صوت (اختياري)
    });

    // --- Timer ---
    socket.on('start_timer', data => {
        let timeLeft = data.seconds;
        const fill = document.getElementById('timerFill');
        const text = document.getElementById('timerText');
        
        const totalTime = timeLeft;
        
        const interval = setInterval(() => {
            timeLeft--;
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            text.innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;
            
            let percent = (timeLeft / totalTime) * 100;
            fill.style.width = percent + "%";
            
            if(timeLeft <= 0) {
                clearInterval(interval);
                // ممكن نضيف منطق لإنهاء الوقت هنا
            }
        }, 1000);
    });

    // --- Results ---
    socket.on('game_over', data => {
        showScreen('screen-result');
        document.getElementById('winnerTitle').innerText = data.winner === 'Humans' ? "البشر كسبوا! 🎉" : "البرص كسب! 🦎";
        document.getElementById('winnerTitle').style.color = data.winner === 'Humans' ? "#00b894" : "#ff7675";
        document.getElementById('resultMsg').innerText = data.msg;
        
        let summaryHtml = "";
        for(let [name, count] of Object.entries(data.votes_summary)) {
            summaryHtml += `<li>${name}: ${count} أصوات</li>`;
        }
        document.getElementById('votesSummary').innerHTML = summaryHtml;
    });

    // --- Punishment ---
    function requestPunishment() {
        socket.emit('request_punishment', {code: myRoom});
    }

    socket.on('show_punishment', data => {
        document.getElementById('punishmentDisplay').classList.remove('hidden');
        document.getElementById('pText').innerText = data.text;
        document.getElementById('pImg').src = "/static/" + data.img;
    });

    function resetGame() {
        socket.emit('reset_game', {code: myRoom});
    }

    socket.on('reset_to_lobby', () => {
        location.reload();
    });

</script>
</body>
</html>
