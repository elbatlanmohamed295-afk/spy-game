<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البرص 🦎 PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffb700; --dark: #0f0f13; --card: #1c1c24; 
            --spy: #ff4757; --human: #2ecc71; --blue: #3742fa;
        }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            font-family: 'Cairo', sans-serif; background: var(--dark); color: #fff; 
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            overflow-x: hidden;
        }
        .container { 
            width: 100%; max-width: 480px; background: var(--card); padding: 25px; 
            border-radius: 30px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            position: relative; overflow: hidden;
        }
        
        /* Typography */
        h1, h2, h3 { text-align: center; margin: 0 0 15px 0; }
        h1 { color: var(--gold); text-shadow: 0 0 10px rgba(255, 183, 0, 0.3); font-size: 2rem; }
        
        /* Inputs & Buttons */
        .input-group { margin-bottom: 15px; }
        input, select { 
            width: 100%; padding: 15px; background: #2c2c35; border: 2px solid #333; 
            border-radius: 12px; color: #fff; font-family: 'Cairo'; font-size: 1.1rem; outline: none;
        }
        input:focus { border-color: var(--gold); }
        
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 12px; 
            font-weight: 900; font-size: 1.2rem; cursor: pointer; transform: scale(1);
        }
        button:active { transform: scale(0.95); }
        .btn-main { background: var(--gold); color: #000; box-shadow: 0 5px 15px rgba(255, 183, 0, 0.2); }
        .btn-vote { background: var(--spy); color: #fff; margin-top: 10px; }
        .btn-secondary { background: #333; color: #ccc; }

        /* Avatars Grid */
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .avatar-option { 
            width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; 
            border: 2px solid transparent; opacity: 0.6;
        }
        .avatar-option:hover, .avatar-option.selected { opacity: 1; border-color: var(--gold); transform: scale(1.1); }

        /* Screens Logic */
        .screen { display: none; animation: fadeIn 0.5s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Player List */
        .player-item { 
            display: flex; align-items: center; background: #252530; padding: 10px; 
            border-radius: 15px; margin-bottom: 8px; border: 1px solid #333;
        }
        .player-img { width: 45px; height: 45px; border-radius: 50%; margin-left: 10px; object-fit: cover; }
        .player-name { flex-grow: 1; font-weight: bold; }
        .badge { font-size: 0.8rem; padding: 2px 8px; border-radius: 5px; background: #333; }

        /* Game Card */
        .game-card { 
            background: linear-gradient(135deg, #fff, #ddd); color: #000; padding: 30px; 
            border-radius: 20px; text-align: center; margin: 20px 0; 
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        .role-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; }
        .location-text { font-size: 2.5rem; color: var(--blue); font-weight: 900; }
        .spy-text { font-size: 2.5rem; color: var(--spy); }

        /* Timer */
        .timer-box { font-size: 2rem; text-align: center; color: var(--gold); font-weight: bold; margin: 20px 0; }

        /* Results */
        .result-box { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .punishment { color: var(--spy); font-size: 1.3rem; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="screen active">
        <h1>لعبة البرص 🦎</h1>
        <div class="input-group">
            <input type="text" id="username" placeholder="اكتب اسمك يا فنان...">
        </div>
        <div class="input-group">
            <input type="text" id="roomCode" placeholder="اسم الغرفة (مثلاً: شبرا)">
        </div>
        <p style="text-align: center; color: #888;">اختر صورتك:</p>
        <div class="avatar-grid" id="avatarList">
            </div>
        <button class="btn-main" onclick="joinGame()">دخول اللعبة 🚀</button>
    </div>

    <div id="lobby-screen" class="screen">
        <h2>غرفة: <span id="lobby-room-name" style="color: var(--gold)"></span></h2>
        <div id="players-list"></div>
        <br>
        <div id="host-controls" style="display:none;">
            <select id="category-select">
                <option value="أماكن 🌍">أماكن 🌍</option>
                <option value="أكلات 🥘">أكلات 🥘</option>
                <option value="أفلام ومسلسلات 🎬">أفلام ومسلسلات 🎬</option>
                <option value="أشياء في البيت 🏠">أشياء في البيت 🏠</option>
            </select>
            <button class="btn-main" onclick="startGame()">ابداً اللعب 🎮</button>
        </div>
        <p id="waiting-msg" style="text-align: center; color: #777;">في انتظار "الأدمن" يبدأ...</p>
    </div>

    <div id="game-screen" class="screen">
        <div class="timer-box" id="timer">05:00</div>
        
        <div class="game-card" id="card-content">
            </div>

        <p style="text-align: center; font-size: 0.9rem; color: #aaa;">اسألوا بعض وحاولوا تكشفوا البرص!</p>
        <button class="btn-vote" onclick="showVoting()">يلا نصوت ✋</button>
    </div>

    <div id="vote-screen" class="screen">
        <h2>مين البرص؟ 🧐</h2>
        <div id="vote-list"></div>
        <p id="vote-status" style="text-align: center; color: var(--gold)"></p>
    </div>

    <div id="result-screen" class="screen">
        <h1 id="win-status"></h1>
        <div class="result-box">
            <p>البرص كان: <strong id="real-spy" style="color: var(--spy); font-size: 1.5rem;"></strong></p>
            <p>المكان كان: <strong id="real-location" style="color: var(--blue);"></strong></p>
            <hr style="border-color: #444;">
            <p class="punishment" id="punishment-text"></p>
        </div>
        <br>
        <button class="btn-main" onclick="location.reload()">لعبة جديدة 🔄</button>
    </div>
</div>

<script>
    const socket = io();
    let mySid = '';
    let currentRoom = '';
    let selectedAvatar = 'https://cdn-icons-png.flaticon.com/512/4140/4140048.png'; // Default
    let timerInterval;

    // --- Setup UI ---
    const avatars = [
        "https://cdn-icons-png.flaticon.com/512/4140/4140048.png",
        "https://cdn-icons-png.flaticon.com/512/4140/4140047.png",
        "https://cdn-icons-png.flaticon.com/512/4140/4140037.png",
        "https://cdn-icons-png.flaticon.com/512/4140/4140051.png",
        "https://cdn-icons-png.flaticon.com/512/1999/1999625.png",
        "https://cdn-icons-png.flaticon.com/512/4140/4140061.png",
        "https://cdn-icons-png.flaticon.com/512/4140/4140077.png",
        "https://cdn-icons-png.flaticon.com/512/924/924874.png"
    ];
    
    const avatarContainer = document.getElementById('avatarList');
    avatars.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.className = 'avatar-option';
        img.onclick = () => {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            img.classList.add('selected');
            selectedAvatar = url;
        };
        avatarContainer.appendChild(img);
    });

    // --- Functions ---
    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function joinGame() {
        const username = document.getElementById('username').value;
        currentRoom = document.getElementById('roomCode').value;
        if(!username || !currentRoom) return alert("دخل بياناتك الأول يا نجم!");
        
        socket.emit('join', { username, room: currentRoom, userImg: selectedAvatar });
        document.getElementById('lobby-room-name').innerText = currentRoom;
        switchScreen('lobby-screen');
    }

    function startGame() {
        const category = document.getElementById('category-select').value;
        socket.emit('start_game', { room: currentRoom, category: category });
    }

    function showVoting() {
        switchScreen('vote-screen');
    }

    function castVote(targetSid) {
        socket.emit('vote_player', { room: currentRoom, targetSid: targetSid });
        // Disable buttons visual feedback
        document.getElementById('vote-list').innerHTML = '<h3 style="text-align:center">تم التصويت... في انتظار الباقي</h3>';
    }

    // --- Socket Listeners ---
    socket.on('update_player_list', (data) => {
        const list = document.getElementById('players-list');
        const voteList = document.getElementById('vote-list');
        list.innerHTML = '';
        voteList.innerHTML = '';
        
        let amIHost = false;

        data.players.forEach(p => {
            if (p.sid === socket.id && p.isHost) amIHost = true;
            
            // قائمة الانتظار
            list.innerHTML += `
                <div class="player-item">
                    <img src="${p.img}" class="player-img">
                    <span class="player-name">${p.name}</span>
                    ${p.isHost ? '<span class="badge" style="color:#ffd700">Admin 👑</span>' : ''}
                </div>`;

            // قائمة التصويت (لا أصوت لنفسي)
            if (p.sid !== socket.id) {
                voteList.innerHTML += `
                    <div class="player-item" onclick="castVote('${p.sid}')" style="cursor:pointer; border:1px solid #444;">
                        <img src="${p.img}" class="player-img">
                        <span class="player-name">صوّت ضد: ${p.name}</span>
                    </div>`;
            }
        });

        if(amIHost) {
            document.getElementById('host-controls').style.display = 'block';
            document.getElementById('waiting-msg').style.display = 'none';
        }
    });

    socket.on('game_started', (data) => {
        switchScreen('game-screen');
        const card = document.getElementById('card-content');
        
        if (data.role === 'spy') {
            card.innerHTML = `
                <div class="role-title">أنت البرص 🦎</div>
                <div class="spy-text">أخفي نفسك!</div>
                <p>حاول تعرف هما بيتكلموا عن ايه..</p>
                <div style="background:#000; color:#fff; padding:5px; border-radius:5px; margin-top:10px;">القسم: ${data.category}</div>
            `;
        } else {
            card.innerHTML = `
                <div class="role-title">أنت بني آدم 🧔</div>
                <div class="location-text">${data.location}</div>
                <p>ماتفضحش المكان، بس اكشف البرص!</p>
            `;
        }

        // Timer Logic
        clearInterval(timerInterval);
        const end = data.endTime * 1000;
        timerInterval = setInterval(() => {
            const now = Date.now();
            const diff = end - now;
            if (diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00";
                showVoting(); // Auto move to vote
            } else {
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }
        }, 1000);
    });

    socket.on('error_msg', (data) => alert(data.msg));

    socket.on('vote_update', (data) => {
        document.getElementById('vote-status').innerText = `تم التصويت: ${data.votes} من ${data.total}`;
        // لو الكل صوت، السيرفر ممكن يبعت النتيجة تلقائي أو الأدمن ينهي، 
        // هنا هنعمل زرار للأدمن أو أي حد يطلب النتيجة
        if(data.votes === data.total) {
            socket.emit('reveal_result', { room: currentRoom });
        }
    });

    socket.on('game_over', (data) => {
        switchScreen('result-screen');
        const winTitle = document.getElementById('win-status');
        
        if (data.spyCaught) {
            winTitle.innerHTML = "البشر كسبوا! 🎉";
            winTitle.style.color = "var(--human)";
        } else {
            winTitle.innerHTML = "البرص هرب! 🦎";
            winTitle.style.color = "var(--spy)";
        }

        document.getElementById('real-spy').innerText = data.spyName;
        document.getElementById('real-location').innerText = data.location;
        
        if(data.spyCaught) {
            document.getElementById('punishment-text').innerHTML = `العقاب لـ ${data.spyName}:<br>${data.punishment}`;
        } else {
            document.getElementById('punishment-text').innerHTML = `الضحية البريئة كان: ${data.victimName} 😢`;
        }
    });

</script>
</body>
</html>
