<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Humans vs Gecko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; touch-action: manipulation; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped .card-inner { transform: rotateY(180deg); }
        .card-face { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">

    <div class="w-full p-3 flex justify-between items-center glass fixed top-0 z-50">
        <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='logo.png') }}" class="w-10 h-10 rounded-full border-2 border-blue-500">
            <span class="font-bold hidden sm:block">Humans vs Gecko</span>
        </div>
        <div id="headerCode" class="font-mono text-yellow-400 font-bold text-xl"></div>
    </div>

    <div class="w-full max-w-lg p-4 mt-16 pb-40">
        
        <div id="screen-login" class="glass rounded-2xl p-6 shadow-2xl border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold mb-6 text-center">تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسمك..." class="w-full bg-slate-800 border border-slate-600 rounded-xl p-4 mb-4 text-center text-lg focus:outline-none focus:border-blue-500">
            
            <button onclick="joinGame(true)" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold shadow-lg mb-6 flex justify-center gap-2">
                <span>🚀</span> إنشاء غرفة
            </button>
            
            <div class="flex gap-2">
                <input type="text" id="roomCodeInput" placeholder="كود الغرفة" class="w-2/3 bg-slate-800 border border-slate-600 rounded-xl p-4 text-center uppercase font-mono tracking-widest">
                <button onclick="joinGame(false)" class="w-1/3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold">دخول</button>
            </div>
            <button onclick="logout()" class="text-xs text-gray-500 mt-4 w-full">مسح بياناتي</button>
        </div>

        <div id="screen-lobby" class="hidden">
            <div class="glass rounded-2xl p-6 mb-4 text-center">
                <p class="text-gray-400 text-sm">كود الغرفة</p>
                <h1 id="lobbyCode" class="text-6xl font-black text-blue-400 tracking-widest my-2 select-all">---</h1>
            </div>

            <div class="glass rounded-2xl p-4 mb-4">
                <h3 class="text-sm font-bold text-gray-400 mb-2">المتصلون:</h3>
                <div id="playersList" class="flex flex-wrap gap-2 justify-center"></div>
            </div>

            <button id="startBtn" onclick="startGame()" class="w-full bg-green-600 hover:bg-green-500 p-4 rounded-xl font-bold shadow-lg hidden">بدء اللعبة 🎮</button>
            <p id="waitingText" class="text-center text-gray-500 text-sm mt-2 animate-pulse">في انتظار الأدمن...</p>
        </div>

        <div id="screen-game" class="hidden">
            <div id="aiBubble" class="hidden mb-4 bg-purple-900/90 border border-purple-500 p-3 rounded-2xl shadow-lg relative animate-bounce mx-2">
                <span class="absolute -top-3 -right-2 text-2xl">🤖</span>
                <p id="aiText" class="text-sm font-bold text-purple-200 text-center"></p>
            </div>

            <div class="card-flip w-full h-56 cursor-pointer group mb-4" onclick="this.classList.toggle('flipped')">
                <div class="card-inner relative w-full h-full text-center rounded-2xl shadow-2xl">
                    <div class="card-face absolute w-full h-full bg-slate-700 rounded-2xl flex flex-col items-center justify-center border-2 border-slate-600">
                        <span class="text-5xl mb-2">🔒</span>
                        <h3 class="text-xl font-bold">اضغط لكشف دورك</h3>
                    </div>
                    <div class="card-face card-back absolute w-full h-full bg-slate-900 rounded-2xl flex flex-col items-center justify-center border-2 border-blue-500 p-4">
                        <div id="roleContent"></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 rounded-full h-3 w-full mb-2 overflow-hidden">
                <div id="timerBar" class="bg-blue-500 h-full w-full transition-all duration-1000 ease-linear"></div>
            </div>
            <p id="timerText" class="text-center font-mono text-xl mb-4 font-bold">05:00</p>

            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="document.getElementById('locModal').classList.remove('hidden')" class="bg-slate-700 p-3 rounded-xl hover:bg-slate-600 text-sm font-bold">🗺️ الأماكن</button>
                <button onclick="document.getElementById('voteModal').classList.remove('hidden')" class="bg-orange-600 p-3 rounded-xl hover:bg-orange-500 text-sm font-bold">🗳️ تصويت</button>
            </div>

            <button onclick="reqPunish()" class="w-full bg-red-900/80 text-red-100 p-3 rounded-xl hover:bg-red-800 font-bold mb-2">🎡 عجلة العقاب</button>
            <button id="aiBtn" onclick="triggerAI()" class="w-full bg-purple-600 hover:bg-purple-500 p-3 rounded-xl font-bold hidden mb-2">🤖 مساعدة AI</button>
            <button id="resetBtn" onclick="resetGame()" class="w-full bg-slate-800 border border-slate-600 text-gray-400 p-3 rounded-xl hidden">إنهاء اللعبة</button>
        </div>
    </div>

    <div id="chatArea" class="hidden fixed bottom-0 left-0 w-full glass z-40 rounded-t-2xl flex flex-col transition-all duration-300 border-t border-blue-500/30" style="height: 35vh;">
        <div class="flex justify-between items-center p-2 border-b border-slate-700 bg-slate-900/80 rounded-t-2xl cursor-pointer" onclick="toggleChatHeight()">
            <span class="text-sm font-bold ml-2">💬 الشات</span>
            <span class="text-xs text-blue-400">▼ تكبير/تصغير</span>
        </div>
        <div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm scrollbar-hide bg-black/30"></div>
        <div class="p-2 flex gap-2 bg-slate-900 border-t border-slate-700">
            <input type="text" id="chatInput" placeholder="اكتب..." class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 focus:outline-none" onkeypress="handleEnter(event)">
            <button onclick="sendChat()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">➤</button>
        </div>
    </div>

    <div id="locModal" class="hidden fixed inset-0 bg-black/95 z-50 p-6 overflow-y-auto flex items-center justify-center">
        <div class="w-full max-w-lg">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-xl">الأماكن</h3>
                <button onclick="document.getElementById('locModal').classList.add('hidden')" class="text-red-500 text-2xl">✕</button>
            </div>
            <div id="locGrid" class="grid grid-cols-2 gap-2 text-sm text-gray-300"></div>
        </div>
    </div>

    <div id="voteModal" class="hidden fixed inset-0 bg-black/95 z-50 p-6 flex items-center justify-center">
        <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl border border-orange-500">
            <h3 class="text-xl font-bold text-center mb-4 text-orange-400">من هو البرص؟ 🤔</h3>
            <div id="voteList" class="space-y-2"></div>
            <button onclick="document.getElementById('voteModal').classList.add('hidden')" class="mt-4 w-full bg-slate-700 p-2 rounded">إلغاء</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myData = {
            name: localStorage.getItem('gm_name') || "",
            userId: localStorage.getItem('gm_uid') || "",
            code: localStorage.getItem('gm_code') || ""
        };

        window.onload = () => {
            if(myData.userId && myData.code) {
                document.getElementById('username').value = myData.name;
                document.getElementById('roomCodeInput').value = myData.code;
                joinGame(false);
            }
        };

        function logout() { localStorage.clear(); location.reload(); }

        function joinGame(isCreate) {
            const name = document.getElementById('username').value.trim();
            const codeInput = document.getElementById('roomCodeInput').value.trim();
            if(!name) return Swal.fire('تنبيه', 'الاسم مطلوب', 'warning');
            if(!isCreate && !codeInput) return Swal.fire('تنبيه', 'الكود مطلوب للدخول', 'warning');

            localStorage.setItem('gm_name', name);
            socket.emit('join_game', { name: name, code: isCreate ? null : codeInput, create: isCreate, userId: myData.userId });
        }

        socket.on('join_success', data => {
            myData.userId = data.userId; myData.code = data.code;
            localStorage.setItem('gm_uid', data.userId); localStorage.setItem('gm_code', data.code);

            showScreen('screen-lobby');
            document.getElementById('lobbyCode').innerText = data.code;
            document.getElementById('headerCode').innerText = data.code;
            document.getElementById('chatArea').classList.remove('hidden');

            if(data.is_host) {
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('resetBtn').classList.remove('hidden');
                document.getElementById('aiBtn').classList.remove('hidden');
                document.getElementById('waitingText').classList.add('hidden');
            }
            if(data.state === 'playing') showScreen('screen-game');
        });

        socket.on('error_msg', data => Swal.fire('خطأ', data.msg, 'error'));

        socket.on('update_players', data => {
            document.getElementById('playersList').innerHTML = data.players.map(p => 
                `<div class="bg-slate-700 px-3 py-1 rounded-full text-sm border border-slate-500 shadow-sm flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div> ${p.name}
                </div>`
            ).join('');
            
            document.getElementById('voteList').innerHTML = data.players.map(p => {
                if (p.id === myData.userId) return '';
                return `<button onclick="submitVote('${p.id}')" class="w-full bg-slate-700 hover:bg-orange-600 p-3 rounded-lg text-left border border-slate-600 transition">👉 ${p.name}</button>`;
            }).join('');
        });

        function startGame() { socket.emit('start_game', {code: myData.code}); }

        socket.on('game_started', data => {
            showScreen('screen-game');
            const content = document.getElementById('roleContent');
            const locGrid = document.getElementById('locGrid');

            if(data.role === 'gecko') {
                content.innerHTML = `<h2 class="text-4xl font-black text-red-500 mb-2">أنت البرص 🦎</h2><p class="text-sm">حاول تعرف المكان!</p>`;
            } else {
                content.innerHTML = `<h2 class="text-3xl font-black text-blue-400 mb-2">مواطن 👮</h2><div class="bg-slate-800 p-2 rounded border border-blue-500 text-xl font-bold mt-2">${data.location}</div>`;
            }

            locGrid.innerHTML = data.all_locations.map(l => `<div class="bg-slate-800 p-2 rounded text-center border border-slate-700">${l}</div>`).join('');
            if(data.reconnect) Swal.fire('أهلاً', 'تم استعادة الدور', 'success');
        });

        socket.on('start_timer', data => {
            let t = data.duration;
            const bar = document.getElementById('timerBar');
            const txt = document.getElementById('timerText');
            if(window.timerInt) clearInterval(window.timerInt);
            window.timerInt = setInterval(() => {
                t--;
                txt.innerText = `${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
                bar.style.width = (t/data.duration*100) + "%";
                if(t<=0) clearInterval(window.timerInt);
            }, 1000);
        });

        function submitVote(suspectId) {
            if(confirm('تأكيد التصويت؟')) {
                socket.emit('submit_vote', {code: myData.code, userId: myData.userId, suspectId: suspectId});
                document.getElementById('voteModal').classList.add('hidden');
                Swal.fire('تم', 'تم إرسال صوتك', 'success');
            }
        }

        socket.on('game_over', data => {
            Swal.fire({
                title: data.winner === 'Humans' ? 'فاز البشر! 🎉' : 'فاز البرص! 🦎',
                html: `البرص كان: <b>${data.gecko_name}</b><br>المشتبه به كان: <b>${data.suspect_name}</b>`,
                icon: data.winner === 'Humans' ? 'success' : 'error'
            });
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            socket.emit('send_message', {code: myData.code, userId: myData.userId, msg: input.value});
            input.value = "";
        }
        function handleEnter(e) { if(e.key === 'Enter') sendChat(); }

        socket.on('new_message', data => {
            const box = document.getElementById('chatMessages');
            const isMe = data.uid === myData.userId;
            let html = '';
            
            if(data.type === 'system') html = `<div class="text-center text-xs text-yellow-400 my-1 bg-yellow-900/30 py-1 rounded w-fit mx-auto px-2">🔔 ${data.msg}</div>`;
            else if(data.type === 'ai') html = `<div class="text-center text-xs text-purple-300 my-1 bg-purple-900/30 py-1 rounded w-fit mx-auto px-2">🤖 ${data.msg}</div>`;
            else html = `<div class="flex flex-col ${isMe ? 'items-start' : 'items-end'} mb-2"><span class="text-[10px] text-gray-500 px-1">${data.sender}</span><div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} px-3 py-1.5 rounded-lg max-w-[85%] text-sm shadow">${data.msg}</div></div>`;
            
            box.insertAdjacentHTML('beforeend', html);
            box.scrollTop = box.scrollHeight;
            if(!isMe && data.type === 'player') new Audio('https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3').play().catch(()=>{});
        });

        socket.on('chat_history', data => {
            document.getElementById('chatMessages').innerHTML = "";
            data.history.forEach(m => {
                 // إعادة رسم الرسائل المحفوظة
                 // (في كود الإنتاج يفضل فصل دالة الرسم، هنا مكررة للسهولة)
                const box = document.getElementById('chatMessages');
                const isMe = m.uid === myData.userId;
                let html = '';
                if(m.type === 'system') html = `<div class="text-center text-xs text-yellow-400 my-1 bg-yellow-900/30 py-1 rounded w-fit mx-auto px-2">🔔 ${m.msg}</div>`;
                else if(m.type === 'ai') html = `<div class="text-center text-xs text-purple-300 my-1 bg-purple-900/30 py-1 rounded w-fit mx-auto px-2">🤖 ${m.msg}</div>`;
                else html = `<div class="flex flex-col ${isMe ? 'items-start' : 'items-end'} mb-2"><span class="text-[10px] text-gray-500 px-1">${m.sender}</span><div class="${isMe ? 'bg-blue-600' : 'bg-slate-700'} px-3 py-1.5 rounded-lg max-w-[85%] text-sm shadow">${m.msg}</div></div>`;
                box.insertAdjacentHTML('beforeend', html);
            });
        });

        function triggerAI() { socket.emit('trigger_ai', {code: myData.code}); }
        socket.on('ai_message', data => {
            const b = document.getElementById('aiBubble');
            document.getElementById('aiText').innerText = data.msg;
            b.classList.remove('hidden');
            setTimeout(() => b.classList.add('hidden'), 8000);
        });

        function reqPunish() { socket.emit('request_punishment', {code: myData.code}); }
        // استخدام url_for في JS صعب، لذا نستخدم المسار الثابت
        socket.on('show_punishment', data => Swal.fire({title:'عقاب!', text:data.text, imageUrl:`/static/${data.image}`, imageWidth:200, background:'#1e293b', color:'#fff'}));

        function resetGame() { if(confirm('إنهاء؟')) socket.emit('reset_game', {code: myData.code}); }
        socket.on('return_to_lobby', () => location.reload());

        function showScreen(id) {
            ['screen-login', 'screen-lobby', 'screen-game'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function toggleChatHeight() {
            const c = document.getElementById('chatArea');
            c.style.height = c.style.height === '35vh' ? '45px' : '35vh';
        }
    </script>
</body>
</html>
